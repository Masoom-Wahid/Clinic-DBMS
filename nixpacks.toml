name = "vite-app"

# Specify the Node.js version to use
nodejs.version = "18"

# Build phase configuration
[build]
  # Install dependencies using npm
  commands = ["npm install"]
  # Build the Vite app
  commands = ["npm run build"]

# Environment variables (optional)
[env]
  NODE_ENV = "production"
# Include specific files in the build context
[include]
  paths = [
    "index.html",
    "package.json",
    "package-lock.json",
    "postcss.config.js",
    "tailwind.config.js",
    "vite.config.js",
    "src/**",
    "public/**"
  ]
